<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathimas Vegetables and Fruits — Archive</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f6f4;--ink:#17231d;--muted:#738078;--line:#e3eae5;--green:#168653;--green2:#0e6b40;--soft:#e9f6ef;--red:#c84c4c;--shadow:0 8px 28px rgba(24,54,38,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:17px}.mark{width:36px;height:36px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:750;font-size:13px}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.shell{max-width:1300px;margin:auto;padding:16px}
.status{font-size:12px;color:var(--muted);margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:750}.card .big{font-size:24px;font-weight:850;letter-spacing:-.5px}
.card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.tabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:12px;font-weight:750;color:#65736b}.tab.active{background:var(--soft);border-color:#b6dfc7;color:var(--green2)}
.wrap{overflow:auto;max-height:60vh}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#f7faf8;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted);margin:12px 2px}
.src{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--soft);color:var(--green2)}.src.f{background:#fff3da;color:#946a00}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="mark">F</div>Fathimas · Archive</div>
  <div class="acts">
    <button class="btn" id="refreshBtn">Refresh from tables</button>
    <button class="btn" id="uploadBtn">Upload JSON</button>
    <input type="file" id="fileIn" accept=".json,application/json" multiple style="display:none">
    <button class="btn danger" id="exportBtn">Export JSON &amp; clear tables</button>
  </div>
</div>
<div class="shell">
  <p class="status" id="status">Loading…</p>
  <div class="cards" id="cards"></div>
  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="wrap" id="view"></div>
  </div>
  <p class="note">Records are matched by ID, so a record in both the uploaded file and the tables appears once (the newer one wins). Uploaded file data is held in this page only; it is not written to Supabase or to page 1's local storage.</p>
</div>

<script>
const SUPABASE_URL='https://vypqxnwvgeskugsmtzvu.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_DBtO5XkgjX-8wiFz-tPR-A_pWiOSYBa';
const T={products:'vegetableproducts',customers:'vegetablecustomers',bills:'vegetablebills',bill_items:'vegetablebill_items',ledger_entries:'vegetablecustomer_ledger_entries'};
const KEYS=Object.keys(T);
const LABEL={bills:'Bills',bill_items:'Bill items',customers:'Customers',products:'Products',ledger_entries:'Ledger'};
let sb=null,busy=false,tab='bills';
let cloud={},file={},fileNames=[];
KEYS.forEach(k=>{cloud[k]=[];file[k]=[]});

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const ts=r=>new Date(r.updated_at||r.created_at||0).getTime()||0;
function say(m){$('status').textContent=m}
function client(){if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);return sb}

/* Combined view = file rows + table rows, matched by id, newer wins */
function combined(){
  const out={};
  KEYS.forEach(k=>{
    const m=new Map();
    [...file[k],...cloud[k]].forEach(r=>{
      if(!r||r.id==null)return;
      const o=m.get(String(r.id));
      if(!o||ts(r)>=ts(o))m.set(String(r.id),r);
    });
    out[k]=[...m.values()];
  });
  return out;
}

/* Read every row (Supabase returns max 1000 per request) */
async function fetchAll(table){
  const rows=[],size=1000;
  for(let from=0;;from+=size){
    const {data,error}=await client().from(table).select('*').range(from,from+size-1);
    if(error)throw error;
    rows.push(...data);
    if(data.length<size)break;
  }
  return rows;
}
async function loadCloud(){
  if(!navigator.onLine)throw new Error('You are offline.');
  const res=await Promise.all(KEYS.map(k=>fetchAll(T[k])));
  KEYS.forEach((k,i)=>cloud[k]=res[i]);
}
async function refresh(){
  if(busy)return;busy=true;say('Reading from Supabase…');
  try{await loadCloud();say('Loaded from Supabase · '+new Date().toLocaleTimeString());}
  catch(e){console.error(e);say('Could not read Supabase: '+(e.message||e));}
  finally{busy=false;render();}
}

/* Upload: accepts files made by this page's export */
function readFile(f){
  return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('Could not read '+f.name));
    r.onload=()=>{try{res(JSON.parse(r.result))}catch(e){rej(new Error(f.name+' is not valid JSON'))}};r.readAsText(f);});
}
async function upload(files){
  let added=0;
  for(const f of files){
    try{
      const d=await readFile(f),t=d&&d.tables;
      if(!t||!KEYS.some(k=>Array.isArray(t[k])))throw new Error(f.name+' is not an archive file from this page');
      KEYS.forEach(k=>{if(Array.isArray(t[k])){file[k].push(...t[k]);added+=t[k].length}});
      fileNames.push(f.name);
    }catch(e){alert(e.message)}
  }
  KEYS.forEach(k=>{const m=new Map();file[k].forEach(r=>{if(r&&r.id!=null){const o=m.get(String(r.id));if(!o||ts(r)>=ts(o))m.set(String(r.id),r)}});file[k]=[...m.values()]});
  say('Uploaded '+added+' records from '+files.length+' file(s). Showing them together with the Supabase tables.');
  render();
}

/* Export: re-read tables, merge with uploaded data, download, then clear exactly the rows that were exported */
async function exportAndClear(){
  if(busy)return;
  if(!confirm('Export everything to a new JSON file and then CLEAR the Supabase tables?\n\nThe file will contain the uploaded file data plus all current table data.'))return;
  busy=true;$('exportBtn').disabled=true;
  try{
    say('Reading latest data from Supabase…');
    await loadCloud();
    const all=combined(),stamp=new Date().toISOString();
    const payload={app:'Fathimas Vegetables Archive',exportedAt:stamp,counts:Object.fromEntries(KEYS.map(k=>[k,all[k].length])),tables:all};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='fathimas-archive-'+stamp.slice(0,19).replace(/[:T]/g,'-')+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),15000);

    const total=KEYS.reduce((n,k)=>n+cloud[k].length,0);
    if(!confirm('The file has been downloaded ('+Object.values(payload.counts).reduce((a,b)=>a+b,0)+' records).\n\nCheck that it saved. Press OK to clear '+total+' rows from the Supabase tables, or Cancel to keep them.')){
      say('Exported. Tables were NOT cleared.');return;
    }
    say('Clearing tables…');
    let failed=[];
    for(const k of ['bill_items','bills','ledger_entries','customers','products']){
      const ids=cloud[k].map(r=>r.id);
      for(let i=0;i<ids.length;i+=100){
        const chunk=ids.slice(i,i+100);
        const {data,error}=await client().from(T[k]).delete().in('id',chunk).select('id');
        if(error)throw error;
        if((data||[]).length!==chunk.length)failed.push(LABEL[k]);
      }
    }
    // the exported data now lives in memory as the "uploaded" set, so the next export still includes it
    KEYS.forEach(k=>{file[k]=all[k];cloud[k]=[]});fileNames.push('(last export)');
    say(failed.length?'Exported, but some rows could not be deleted ('+[...new Set(failed)].join(', ')+'). Check Supabase delete permissions (RLS policy).':'Exported and tables cleared · '+new Date().toLocaleTimeString());
  }catch(e){console.error(e);say('Failed: '+(e.message||e)+' · Tables were not fully cleared.');}
  finally{busy=false;$('exportBtn').disabled=false;render();}
}

/* Display */
function render(){
  const all=combined();
  const sales=all.bills.reduce((n,b)=>n+Number(b.total||0),0);
  const card=(t,big,rows)=>`<div class="card"><h3>${t}</h3><div class="big">${big}</div>${rows.map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>`;
  $('cards').innerHTML=
    card('Combined bills',all.bills.length,[['In Supabase tables',cloud.bills.length],['From uploaded file',file.bills.length]])+
    card('Combined sales',money(sales),[['Retail',money(all.bills.filter(b=>b.type==='retail').reduce((n,b)=>n+Number(b.total||0),0))],['Wholesale',money(all.bills.filter(b=>b.type==='wholesale').reduce((n,b)=>n+Number(b.total||0),0))]])+
    card('Other records',all.customers.length+all.products.length+all.ledger_entries.length,[['Customers',all.customers.length],['Products',all.products.length],['Ledger entries',all.ledger_entries.length]])+
    card('Uploaded files',fileNames.length,[[fileNames.slice(-2).map(esc).join(', ')||'None','']]);
  $('tabs').innerHTML=KEYS.slice().sort((a,b)=>['bills','bill_items','customers','products','ledger_entries'].indexOf(a)-['bills','bill_items','customers','products','ledger_entries'].indexOf(b))
    .map(k=>`<button class="tab ${k===tab?'active':''}" data-t="${k}">${LABEL[k]} (${all[k].length})</button>`).join('');
  const cloudIds=new Set(cloud[tab].map(r=>String(r.id)));
  const rows=all[tab].slice().sort((a,b)=>String(b.created_at||b.entry_date||b.updated_at||'').localeCompare(String(a.created_at||a.entry_date||a.updated_at||'')));
  if(!rows.length){$('view').innerHTML='<div class="empty">No records yet.</div>';return}
  const cols=[...new Set(rows.slice(0,50).flatMap(r=>Object.keys(r)))].filter(c=>!['updated_at'].includes(c));
  $('view').innerHTML='<table><thead><tr><th>Source</th>'+cols.map(c=>`<th>${esc(c.replace(/_/g,' '))}</th>`).join('')+'</tr></thead><tbody>'+
    rows.slice(0,500).map(r=>`<tr><td>${cloudIds.has(String(r.id))?'<span class="src">Tables</span>':'<span class="src f">File</span>'}</td>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')+
    '</tbody></table>'+(rows.length>500?`<div class="empty">Showing the first 500 of ${rows.length}. The export includes all of them.</div>`:'');
}
$('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){tab=t.dataset.t;render()}});
$('refreshBtn').onclick=refresh;
$('exportBtn').onclick=exportAndClear;
$('uploadBtn').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{if(e.target.files.length)upload([...e.target.files]);e.target.value=''};
render();refresh();
</script>
</body>
</html>
