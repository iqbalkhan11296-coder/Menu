<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARRAS | Digital Menu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --burgundy:#430019;
    --burgundy-dark:#26000d;
    --burgundy-light:#68002a;
    --gold:#d9b45b;
    --gold-light:#f1d98c;
    --cream:#fff8e9;
    --text:#f8efd9;
    --muted:#cdbb9d;
    --line:rgba(217,180,91,.28);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at top right, rgba(217,180,91,.08), transparent 30%),
        radial-gradient(circle at bottom left, rgba(104,0,42,.35), transparent 35%),
        var(--burgundy-dark);

    color:var(--text);
    font-family:"DM Sans",sans-serif;
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{
    text-align:center;
    padding:55px 20px 35px;

    border-bottom:1px solid var(--line);

    background:
        linear-gradient(
            180deg,
            rgba(104,0,42,.65),
            rgba(38,0,13,.2)
        );
}

.logo{
    font-family:"Cormorant Garamond",serif;
    font-size:72px;
    letter-spacing:10px;
    color:var(--gold-light);
    font-weight:600;
    line-height:.9;
}

.established{
    margin-top:12px;
    font-size:10px;
    letter-spacing:5px;
    text-transform:uppercase;
    color:var(--gold);
}

.tagline{
    margin-top:18px;
    font-family:"Cormorant Garamond",serif;
    font-size:22px;
    font-style:italic;
    color:var(--cream);
}


/* =========================
   SEARCH
========================= */

.search-wrap{
    max-width:520px;
    margin:30px auto 0;
}

.search{
    width:100%;
    padding:15px 20px;

    border-radius:40px;

    border:1px solid var(--line);

    background:rgba(255,255,255,.05);

    color:white;

    outline:none;

    font-family:inherit;
    font-size:14px;

    text-align:center;
}

.search::placeholder{
    color:var(--muted);
}

.search:focus{
    border-color:var(--gold);
}


/* =========================
   CATEGORY NAV
========================= */

.category-nav{
    position:sticky;
    top:0;
    z-index:20;

    display:flex;
    justify-content:center;
    gap:8px;

    padding:13px 10px;

    background:rgba(38,0,13,.94);

    backdrop-filter:blur(15px);

    border-bottom:1px solid var(--line);

    overflow-x:auto;
}

.category-nav a{
    flex-shrink:0;

    text-decoration:none;

    color:var(--muted);

    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;

    padding:9px 16px;

    border:1px solid transparent;

    border-radius:30px;

    transition:.25s;
}

.category-nav a:hover{
    color:var(--gold-light);
    border-color:var(--line);
}


/* =========================
   MENU
========================= */

.menu-container{
    max-width:1100px;
    margin:auto;
    padding:20px 18px 70px;
}


/* =========================
   CATEGORY SECTION
========================= */

.category{
    padding-top:50px;
    margin-bottom:30px;
}

.category-heading{
    text-align:center;
    margin-bottom:30px;
}

.category-heading .small{
    display:block;

    color:var(--gold);

    font-size:10px;
    letter-spacing:4px;

    text-transform:uppercase;

    margin-bottom:7px;
}

.category-heading h2{
    font-family:"Cormorant Garamond",serif;

    font-size:46px;

    font-weight:600;

    letter-spacing:3px;

    color:var(--cream);
}

.category-heading .line{
    width:70px;
    height:1px;

    background:var(--gold);

    margin:12px auto 0;
}


/* =========================
   ITEMS GRID
========================= */

.items{
    display:grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap:1px;

    border:1px solid var(--line);

    background:var(--line);
}


/* =========================
   ITEM
========================= */

.item{
    position:relative;

    padding:24px 25px;

    background:
        linear-gradient(
            135deg,
            rgba(104,0,42,.48),
            rgba(38,0,13,.8)
        );

    min-height:125px;

    transition:.25s;
}

.item:hover{
    background:
        linear-gradient(
            135deg,
            rgba(104,0,42,.7),
            rgba(38,0,13,.9)
        );
}

.item-top{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:15px;
}

.item-name{
    font-family:"Cormorant Garamond",serif;

    font-size:25px;

    font-weight:600;

    color:var(--cream);

    line-height:1.05;
}

.price{
    white-space:nowrap;

    color:var(--gold-light);

    font-size:18px;

    font-weight:600;
}

.description{
    margin-top:9px;

    max-width:600px;

    color:var(--muted);

    font-size:12px;

    line-height:1.55;
}


/* =========================
   SPECIAL PRICE
========================= */

.item::after{
    content:"";

    position:absolute;

    left:25px;
    bottom:13px;

    width:25px;

    height:1px;

    background:var(--gold);

    opacity:.45;
}


/* =========================
   FOOTER
========================= */

footer{
    text-align:center;

    padding:45px 20px 55px;

    border-top:1px solid var(--line);

    background:#1c0009;
}

.footer-logo{
    font-family:"Cormorant Garamond",serif;

    font-size:34px;

    letter-spacing:5px;

    color:var(--gold);
}

.footer-text{
    margin-top:10px;

    font-size:10px;

    letter-spacing:3px;

    text-transform:uppercase;

    color:var(--muted);
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        padding:40px 18px 30px;
    }

    .logo{
        font-size:55px;
        letter-spacing:7px;
    }

    .tagline{
        font-size:19px;
    }

    .category-nav{
        justify-content:flex-start;
    }

    .menu-container{
        padding:10px 10px 60px;
    }

    .category{
        padding-top:40px;
    }

    .category-heading h2{
        font-size:40px;
    }

    .items{
        grid-template-columns:1fr;
    }

    .item{
        padding:21px 19px;
        min-height:115px;
    }

    .item-name{
        font-size:24px;
    }

    .price{
        font-size:17px;
    }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:380px){

    .logo{
        font-size:48px;
    }

    .category-heading h2{
        font-size:36px;
    }

    .item-name{
        font-size:22px;
    }

}

</style>

/* =========================
   DISPLAY MENU
========================= */

function displayMenu(items){

    const containers = {

        chaats:
        document.getElementById("chaats-items"),

        burgers:
        document.getElementById("burgers-items"),

        drinks:
        document.getElementById("drinks-items"),

        combos:
        document.getElementById("combos-items")

    };


    Object.values(containers).forEach(container=>{
        container.innerHTML="";
    });


    items.forEach(item=>{

        const card = document.createElement("div");

        card.className="item";


        card.innerHTML=`

            <div class="item-top">

                <div class="item-name">
                    ${item.name}
                </div>

                <div class="price">
                    ₹${item.price}
                </div>

            </div>

            <div class="description">
                ${item.description}
            </div>

        `;


        if(containers[item.category]){

            containers[item.category].appendChild(card);

        }

    });

}


/* =========================
   SEARCH
========================= */

document
.getElementById("search")
.addEventListener("input",function(){

    const query =
        this.value
        .toLowerCase()
        .trim();


    if(!query){

        displayMenu(menu);

        return;

    }


    const filtered =
        menu.filter(item=>

            item.name
            .toLowerCase()
            .includes(query)

            ||

            item.description
            .toLowerCase()
            .includes(query)

        );


    displayMenu(filtered);

});


/* INITIAL LOAD */
