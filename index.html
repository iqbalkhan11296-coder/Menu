/* =========================================================
   STATE
   ========================================================= */

let selectedCategory = "all";

let cart = [];



/* =========================================================
   ELEMENTS
   ========================================================= */

const menuGrid =
    document.getElementById("menuGrid");

const search =
    document.getElementById("search");

const noResults =
    document.getElementById("noResults");

const cartButton =
    document.getElementById("cartButton");

const overlay =
    document.getElementById("overlay");

const cartPanel =
    document.getElementById("cartPanel");

const cartItems =
    document.getElementById("cartItems");

const cartTotal =
    document.getElementById("cartTotal");

const floatingTotal =
    document.getElementById("floatingTotal");



/* =========================================================
   DISPLAY MENU
   ========================================================= */

function displayMenu() {

    const searchText =
        search.value
        .toLowerCase()
        .trim();


    const filtered =
        menu.filter(item => {

            const categoryOK =
                selectedCategory === "all" ||
                item.category === selectedCategory;


            const searchOK =
                item.name
                    .toLowerCase()
                    .includes(searchText)
                ||
                item.description
                    .toLowerCase()
                    .includes(searchText);


            return categoryOK && searchOK;

        });


    menuGrid.innerHTML = "";


    if (filtered.length === 0) {

        noResults.style.display =
            "block";

        return;

    }


    noResults.style.display =
        "none";


    filtered.forEach(item => {

        const card =
            document.createElement("article");


        card.className =
            "item";


        card.innerHTML = `

            <div class="item-top">

                <div class="item-name">
                    ${item.name}
                </div>

                <div class="price">
                    ₹${item.price}
                </div>

            </div>

            <div class="description">
                ${item.description}
            </div>

            <button
                class="add"
                onclick="addToCart(${item.id})"
            >
                ADD TO ORDER
            </button>

        `;


        menuGrid.appendChild(card);

    });

}



/* =========================================================
   CATEGORY BUTTONS
   ========================================================= */

document
    .querySelectorAll(".category")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".category")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );


                button.classList.add("active");


                selectedCategory =
                    button.dataset.category;


                displayMenu();

            }
        );

    });



/* =========================================================
   SEARCH
   ========================================================= */

search.addEventListener(
    "input",
    displayMenu
);



/* =========================================================
   ADD TO CART
   ========================================================= */

function addToCart(id) {

    const product =
        menu.find(
            item => item.id === id
        );


    if (!product) return;


    const existing =
        cart.find(
            item => item.id === id
        );


    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            id: product.id,

            name: product.name,

            price: product.price,

            quantity: 1

        });

    }


    updateCart();

}



/* =========================================================
   CHANGE QUANTITY
   ========================================================= */

function changeQuantity(
    id,
    amount
) {

    const item =
        cart.find(
            product =>
                product.id === id
        );


    if (!item) return;


    item.quantity += amount;


    if (item.quantity <= 0) {

        cart =
            cart.filter(
                product =>
                    product.id !== id
            );

    }


    updateCart();

}



/* =========================================================
   UPDATE CART
   ========================================================= */

function updateCart() {

    cartItems.innerHTML = "";


    let total = 0;

    let count = 0;


    cart.forEach(item => {

        total +=
            item.price *
            item.quantity;


        count +=
            item.quantity;


        const row =
            document.createElement("div");


        row.className =
            "cart-row";


        row.innerHTML = `

            <div class="cart-row-top">

                <div class="cart-row-name">
                    ${item.name}
                </div>

                <div class="cart-row-price">
                    ₹${item.price * item.quantity}
                </div>

            </div>


            <div class="cart-row-bottom">

                <div>
                    ₹${item.price} each
                </div>


                <div class="quantity">

                    <button
                        onclick="changeQuantity(${item.id}, -1)"
                    >
                        −
                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button
                        onclick="changeQuantity(${item.id}, 1)"
                    >
                        +
                    </button>

                </div>

            </div>

        `;


        cartItems.appendChild(row);

    });


    cartTotal.textContent =
        total;


    floatingTotal.textContent =
        total;


    if (count > 0) {

        cartButton.classList.add("show");

    } else {

        cartButton.classList.remove("show");

        cartItems.innerHTML = `

            <div style="
                text-align:center;
                padding:70px 20px;
                color:#cdbd9f;
                font-size:12px;
            ">

                Your order is empty.

                <br><br>

                Add something delicious.

            </div>

        `;

    }

}



/* =========================================================
   OPEN CART
   ========================================================= */

function openCart() {

    overlay.classList.add("show");

    cartPanel.classList.add("show");

    document.body.style.overflow =
        "hidden";

}



/* =========================================================
   CLOSE CART
   ========================================================= */

function closeCart() {

    overlay.classList.remove("show");

    cartPanel.classList.remove("show");

    document.body.style.overflow =
        "";

}


cartButton.addEventListener(
    "click",
    openCart
);


document
    .getElementById("closeCart")
    .addEventListener(
        "click",
        closeCart
    );


overlay.addEventListener(
    "click",
    closeCart
);



/* =========================================================
   CHECKOUT
   ========================================================= */

document
    .getElementById("checkout")
    .addEventListener(
        "click",
        checkout
    );


function checkout() {

    if (cart.length === 0) {

        alert(
            "Your order is empty."
        );

        return;

    }


    let message =
        "ARRAS ORDER\n\n";


    cart.forEach(item => {

        message +=
            item.name +
            " × " +
            item.quantity +
            " = ₹" +
            (
                item.price *
                item.quantity
            ) +
            "\n";

    });


    const total =
        cart.reduce(
            (sum, item) =>
                sum +
                item.price *
                item.quantity,
            0
        );


    message +=
        "\nTOTAL: ₹" +
        total;


    alert(
        message +
        "\n\nOrder system will be connected next."
    );

}



/* =========================================================
   INITIALIZE
   ========================================================= */

displayMenu();

updateCart();


</script>

</body>
</html>
